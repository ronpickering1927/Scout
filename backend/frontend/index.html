<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout</title>
</head>
<body>
    <h1>Scout</h1>

    <button id="load-opportunities">Load Opportunities</button>
<h2>Add Opportunity</h2>

<input id="title" placeholder="Title">
<input id="company" placeholder="Company">
<input id="location" placeholder="Location">
<input id="salary" placeholder="Salary">
<input id="url" placeholder="URL">

<button id="add-opportunity">Add Opportunity</button>
    <div id="opportunities"></div>

    <script>
        const button = document.getElementById("load-opportunities");
        const addButton = document.getElementById("add-opportunity");
        const opportunities = document.getElementById("opportunities");

        button.addEventListener("click", async () => {
            const response = await fetch("/opportunities");
            const data = await response.json();

            opportunities.innerHTML = "";

            data.forEach((opportunity) => {
                const item = document.createElement("div");

                item.innerHTML = `
                    <h2>${opportunity.title}</h2>
                    <p>${opportunity.company}</p>
                    <p>${opportunity.location}</p>
                    <p>${opportunity.salary}</p>
                `;

                opportunities.appendChild(item);
            });
        });
        addButton.addEventListener("click", async () => {
            const opportunity = {
                title: document.getElementById("title").value,
                company: document.getElementById("company").value,
                location: document.getElementById("location").value,
                salary: document.getElementById("salary").value,
                url: document.getElementById("url").value
            };

            const response = await fetch("/opportunities", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(opportunity)
            });

            if (response.ok) {
                document.getElementById("title").value = "";
                document.getElementById("company").value = "";
                document.getElementById("location").value = "";
                document.getElementById("salary").value = "";
                document.getElementById("url").value = "";

                button.click();
            }
        });
    </script>
</body>
</html>
